; v2.2-zero (PoC): sync WebServer (ESP32 Arduino 내장) 사용
;   - mathieucarbou async 제거 (task 슬롯 충돌 회피)
;   - sync WebServer 는 framework-arduino 내장이라 lib_deps 추가 불필요
;   - platform 은 v2.1 그대로 (pioarduino 53.03.10) — 회귀 위험 최소화

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	; v2.1 C5: TFT_eSPI User_Setup.h 값을 build_flags 로 이식
	-DUSER_SETUP_LOADED=1
	-DST7789_2_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=19
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=15
	-DTFT_DC=27
	-DTFT_RST=26
	-DTFT_BL=25
	-DTFT_BACKLIGHT_ON=HIGH
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=27000000
lib_deps =
	bitbank2/FT6236G@^1.0.0
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.18.5
	bodmer/TFT_eSPI@^2.5.43
board_build.partitions = huge_app.csv
board_build.filesystem = spiffs
