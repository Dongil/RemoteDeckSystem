; v2.3-httpd: esp_http_server (ESP-IDF native) 기반 WebUI 재설계
;   - v2.1 LAN 스택 (ETH.h + ETH_PHY_W5500) 유지
;   - v2.2 sync WebServer 가설 폐기 → ESP-IDF native httpd 별도 task + core 0 pinning
;   - mathieucarbou async lib 완전 제거 (AsyncTCP task slot 충돌 본질 회피)
;   - LV_USE_PNG=1 (module-webui 단계에서 활성, 빌드 flag 만 선반영)

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	; v2.1 C5: TFT_eSPI User_Setup.h 값을 build_flags 로 이식
	; (lib/TFT_eSPI/User_Setup.h 와 동일 — 바이너리 호환 유지)
	-DUSER_SETUP_LOADED=1
	-DST7789_2_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=19
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=15
	-DTFT_DC=27
	-DTFT_RST=26
	-DTFT_BL=25
	-DTFT_BACKLIGHT_ON=HIGH
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=27000000
	; v2.3-httpd module-poc: esp_http_server 설정 — Design §2.1
	-DCONFIG_HTTPD_MAX_REQ_HDR_LEN=1024
	-DCONFIG_HTTPD_MAX_URI_LEN=512
lib_deps =
	bitbank2/FT6236G@^1.0.0
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.18.5
	bodmer/TFT_eSPI@^2.5.43
board_build.partitions = huge_app.csv
board_build.filesystem = spiffs
