; PlatformIO Project Configuration File
; Note: LAN 스택 통일(ETH.h + ETH_PHY_W5500)은 별도 PDCA 사이클로 분리.
;       현재는 arduino-libraries/Ethernet (Touch 기존 방식) 유지.
;       WebServer는 WiFi 환경에서만 동작 (W5500 + AsyncTCP 비호환 우회).

[env:esp32dev]
platform = platformio/espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	bitbank2/FT6236G@^1.0.0
	knolleary/PubSubClient@^2.8
	arduino-libraries/Ethernet@^2.0.2
	bblanchon/ArduinoJson@^6.18.5
	arduino-libraries/ArduinoHttpClient@^0.6.1
	esphome/ESPAsyncWebServer-esphome@^3.0.0
	esphome/AsyncTCP-esphome@^2.0.0
board_build.partitions = huge_app.csv
board_build.filesystem = spiffs
