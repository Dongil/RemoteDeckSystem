; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
; Pin to Arduino-ESP32 2.x — arduino-libraries/Ethernet@2.0.2 is incompatible
; with Arduino-ESP32 3.x (pure virtual Client::connect overloads → abstract type errors).
platform = platformio/espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	bitbank2/FT6236G@^1.0.0
	knolleary/PubSubClient@^2.8
	arduino-libraries/Ethernet@^2.0.2
	bblanchon/ArduinoJson@^6.18.5
	arduino-libraries/ArduinoHttpClient@^0.6.1
board_build.partitions = huge_app.csv
