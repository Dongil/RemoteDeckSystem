; v2.1-lan: RemoteDeck_PC v2.3.0 와 동일 platform/lib 통일
;   - pioarduino 53.03.10 (Arduino-ESP32 3.x) — ETH_PHY_W5500 + lwIP 통합
;   - arduino-libraries/Ethernet 제거 (lwIP 미경유 → AsyncTCP 비호환)
;   - ArduinoHttpClient 제거 (Arduino-ESP32 3.x Client 추상 클래스 미구현)
;   - HTTPClient (ESP32 내장) + ESPAsyncWebServer mathieucarbou 3.x

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	-DASYNCWEBSERVER_REGEX=1
	; v2.1 C5: TFT_eSPI User_Setup.h 값을 build_flags 로 이식
	; (lib/TFT_eSPI/User_Setup.h 와 동일 — 바이너리 호환 유지)
	-DUSER_SETUP_LOADED=1
	-DST7789_2_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=19
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=15
	-DTFT_DC=27
	-DTFT_RST=26
	-DTFT_BL=25
	-DTFT_BACKLIGHT_ON=HIGH
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=27000000
lib_deps =
	bitbank2/FT6236G@^1.0.0
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.18.5
	mathieucarbou/AsyncTCP@^3.2.14
	mathieucarbou/ESPAsyncWebServer@^3.6.0
	bodmer/TFT_eSPI@^2.5.43
lib_ignore =
	ESPAsyncTCP
	AsyncTCP_RP2040W
board_build.partitions = huge_app.csv
board_build.filesystem = spiffs
