; v2.5-sunset: WebServer 코드 전체 제거 후 platformio 정리
;   - v2.3 의 CONFIG_HTTPD_* build_flags 제거 (WebServer 없음)
;   - v2.1 LAN 스택 (ETH.h + ETH_PHY_W5500) 유지
;   - LCD/Touch/MQTT only 운영

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
	; v2.1 C5: TFT_eSPI User_Setup.h 값을 build_flags 로 이식
	; (lib/TFT_eSPI/User_Setup.h 와 동일 — 바이너리 호환 유지)
	-DUSER_SETUP_LOADED=1
	-DST7789_2_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=19
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=15
	-DTFT_DC=27
	-DTFT_RST=26
	-DTFT_BL=25
	-DTFT_BACKLIGHT_ON=HIGH
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=27000000
lib_deps =
	bitbank2/FT6236G@^1.0.0
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.18.5
	bodmer/TFT_eSPI@^2.5.43
board_build.partitions = huge_app.csv
board_build.filesystem = spiffs
