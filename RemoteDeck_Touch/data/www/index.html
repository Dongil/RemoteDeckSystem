<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RemoteDeck_Touch v2.2</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>RemoteDeck_Touch · v2.2</h1>
  <span id="statusBar">loading...</span>
</header>

<nav>
  <button class="tab active" data-tab="control">Control</button>
  <button class="tab" data-tab="images">Images</button>
  <button class="tab" data-tab="config">Config</button>
  <button class="tab" data-tab="logs">Logs</button>
</nav>

<main>
  <!-- CONTROL TAB (LCD 미러링) -->
  <section class="page active" id="page-control">
    <div class="card">
      <h2>단말 상태 (실시간)</h2>
      <p class="hint">단말 LCD 와 동일한 레이아웃입니다. 가운데 영역을 누르면 재실/부재를 토글합니다 (단말의 재부재 버튼과 동일).</p>
      <div class="lcd-mirror" id="lcdMirror">
        <div class="lcd-slot lcd-title">
          <img id="lcdTitle" alt="title">
        </div>
        <div class="lcd-slot lcd-photo" id="lcdPhotoArea" title="클릭하여 재실/부재 토글">
          <img id="lcdPhoto" alt="photo">
          <div class="lcd-state" id="lcdState">…</div>
        </div>
        <div class="lcd-slot lcd-name">
          <img id="lcdName" alt="name">
        </div>
      </div>
      <div class="state-row">
        <span>현재 상태:</span>
        <span class="state-badge" id="stateBadge">…</span>
        <span class="device-id" id="ctrlDeviceId"></span>
      </div>
      <div class="btn-row">
        <button id="btnSetIn" class="primary">재실 (IN)</button>
        <button id="btnSetOut">부재 (OUT)</button>
        <button id="btnToggle">토글</button>
      </div>
    </div>
  </section>

  <!-- IMAGES TAB -->
  <section class="page" id="page-images">
    <div class="card">
      <h2>현재 이미지</h2>
      <div class="card-row" id="imageCards"></div>
    </div>
    <div class="card">
      <h2>업로드 (PNG/BMP, max 200KB)</h2>
      <div id="dropZone" class="drop-zone">
        <p>파일을 여기에 드래그&드롭<br>또는</p>
        <input type="file" id="fileInput" accept=".png,.bmp">
      </div>
      <div class="progress-bar" id="progressBar" hidden>
        <div class="progress-fill" id="progressFill">0%</div>
      </div>
    </div>
  </section>

  <!-- CONFIG TAB -->
  <section class="page" id="page-config">
    <div class="card">
      <h2>Device Config</h2>
      <textarea id="deviceConfigText" rows="14" spellcheck="false"></textarea>
      <div class="btn-row">
        <button id="btnLoadDevice">불러오기</button>
        <button id="btnSaveDevice" class="primary">저장</button>
      </div>
    </div>
    <div class="card">
      <h2>Server Config</h2>
      <textarea id="serverConfigText" rows="14" spellcheck="false"></textarea>
      <div class="btn-row">
        <button id="btnLoadServer">불러오기</button>
        <button id="btnSaveServer" class="primary">저장</button>
      </div>
    </div>
    <div class="card">
      <h2>Reboot</h2>
      <p>설정 변경 후 재부팅하여 적용합니다.</p>
      <button id="btnReboot" class="danger">단말 재부팅</button>
    </div>
  </section>

  <!-- LOGS TAB -->
  <section class="page" id="page-logs">
    <div class="card">
      <h2>최근 로그 (50건)</h2>
      <div class="btn-row">
        <button id="btnRefreshLogs">새로고침</button>
        <label class="auto-refresh"><input type="checkbox" id="autoRefresh" checked> 5초 자동</label>
      </div>
      <div class="log-container" id="logContainer"></div>
    </div>
  </section>
</main>

<div id="toast" class="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
