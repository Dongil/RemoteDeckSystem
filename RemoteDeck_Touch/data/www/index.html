<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RemoteDeck_Touch · Image Manager</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>RemoteDeck_Touch · Image Manager</h1>
  <span id="statusBar">loading...</span>
</header>

<main>
  <section class="card">
    <h2>현재 이미지</h2>
    <div class="card-row" id="imageCards">
      <!-- JS renders here -->
    </div>
  </section>

  <section class="card">
    <h2>업로드</h2>
    <div id="dropZone" class="drop-zone">
      <p>PNG 또는 BMP 파일을 여기에 드래그&드롭<br>또는</p>
      <input type="file" id="fileInput" accept=".png,.bmp">
    </div>
    <div class="progress-bar" id="progressBar" hidden>
      <div class="progress-fill" id="progressFill">0%</div>
    </div>
  </section>

  <section class="card">
    <h2>최근 활동</h2>
    <div class="log-container" id="activityLog">
      <div class="log-entry"><span class="time">--:--:--</span> <span class="event">READY</span> 시작됨</div>
    </div>
  </section>
</main>

<div id="toast" class="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
