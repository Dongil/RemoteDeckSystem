<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RemoteDeck PC 전원 관리</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>RemoteDeck PC 전원 관리</h1>
  <span id="fw-ver"></span>
</header>
<nav>
  <button class="tab active" data-tab="home">홈</button>
  <button class="tab" data-tab="control">제어</button>
  <button class="tab" data-tab="schedule">스케줄</button>
  <button class="tab" data-tab="settings">설정</button>
  <button class="tab" data-tab="ota">펌웨어</button>
  <button class="tab" data-tab="log">로그</button>
</nav>

<!-- 홈 -->
<section id="home" class="page active">
  <div class="card-row">
    <div class="card">
      <h2>PC 상태</h2>
      <div class="status-indicator" id="pc-status">
        <span class="dot" id="pc-dot"></span>
        <span id="pc-text">--</span>
      </div>
      <div class="status-line">릴레이1: <span id="r1">--</span></div>
      <div class="status-line">릴레이2: <span id="r2">--</span></div>
      <div class="status-line">GPIO: <span id="gpio-val">--</span></div>
    </div>
    <div class="card">
      <h2>시스템 정보</h2>
      <div class="status-line">장치 ID: <span id="dev-id">--</span></div>
      <div class="status-line">IP 주소: <span id="ip-addr">--</span></div>
      <div class="status-line">가동 시간: <span id="uptime">--</span></div>
      <div class="status-line">MQTT: <span id="mqtt-st">--</span></div>
      <div class="status-line">시각: <span id="ntp-time">--</span></div>
    </div>
  </div>
</section>

<!-- 제어 -->
<section id="control" class="page">
  <div class="card">
    <h2>릴레이 제어</h2>
    <div class="btn-group">
      <button onclick="relay(1,'pulse')">릴레이1 펄스</button>
      <button onclick="relay(1,'on')">릴레이1 켜기</button>
      <button onclick="relay(1,'off')">릴레이1 끄기</button>
    </div>
    <div class="btn-group">
      <button onclick="relay(2,'pulse')">릴레이2 펄스</button>
      <button onclick="relay(2,'on')">릴레이2 켜기</button>
      <button onclick="relay(2,'off')">릴레이2 끄기</button>
    </div>
  </div>
  <div class="card">
    <h2>Wake-on-LAN</h2>
    <input type="text" id="wol-mac" placeholder="AA:BB:CC:DD:EE:FF">
    <button onclick="sendWOL()">WOL 전송</button>
  </div>
</section>

<!-- 스케줄 -->
<section id="schedule" class="page">
  <div class="card">
    <h2>전원 스케줄</h2>
    <div id="sched-list"></div>
    <h3>스케줄 추가</h3>
    <div class="form-row">
      <label>시간: <input type="time" id="s-time" value="09:00"></label>
      <label>릴레이: <select id="s-relay"><option value="1">1</option><option value="2">2</option></select></label>
      <label>동작: <select id="s-action"><option value="on">켜기</option><option value="off">끄기</option><option value="toggle">토글</option></select></label>
    </div>
    <div class="form-row">
      <label><input type="checkbox" id="d-mon" checked> 월</label>
      <label><input type="checkbox" id="d-tue" checked> 화</label>
      <label><input type="checkbox" id="d-wed" checked> 수</label>
      <label><input type="checkbox" id="d-thu" checked> 목</label>
      <label><input type="checkbox" id="d-fri" checked> 금</label>
      <label><input type="checkbox" id="d-sat"> 토</label>
      <label><input type="checkbox" id="d-sun"> 일</label>
    </div>
    <button onclick="addSchedule()">추가</button>
  </div>
</section>

<!-- 설정 -->
<section id="settings" class="page">
  <div class="card">
    <h2>장치 설정</h2>
    <div id="config-form"></div>
    <button onclick="loadConfig()">새로고침</button>
    <button onclick="saveConfig()">저장 및 재부팅</button>
  </div>
</section>

<!-- 펌웨어 -->
<section id="ota" class="page">
  <div class="card">
    <h2>펌웨어 업데이트</h2>
    <p>현재 버전: <span id="ota-ver">--</span></p>
    <input type="file" id="ota-file" accept=".bin">
    <button onclick="uploadOTA()">업로드</button>
    <div class="progress-bar"><div id="ota-progress" class="progress-fill"></div></div>
    <span id="ota-pct">0%</span>
  </div>
</section>

<!-- 로그 -->
<section id="log" class="page">
  <div class="card">
    <h2>이벤트 로그</h2>
    <button onclick="loadLogs()">새로고침</button>
    <div id="log-list" class="log-container"></div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
